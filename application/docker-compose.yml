version: "3.9"

# ── IoT Simulation Layer ──────────────────────────────────────────────────────
# Simulator + Backend API + Frontend
# Requires streaming layer running first.
# Start: docker compose -f docker-compose.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  simulator:
    build: ./simulators
    environment:
      KAFKA_BROKER: ${KAFKA_BROKER:-kafka:9092}
      KAFKA_TOPIC:  ${KAFKA_TOPIC:-truck-gps}
      CASSANDRA_HOST:     ${CASSANDRA_HOST:-cassandra}
      CASSANDRA_PORT:     ${CASSANDRA_PORT:-9042}
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE:-fleet}
    networks:
      - iot_network

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      CASSANDRA_HOST:     ${CASSANDRA_HOST:-cassandra}
      CASSANDRA_PORT:     ${CASSANDRA_PORT:-9042}
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE:-fleet}
    networks:
      - iot_network
    restart: on-failure

  frontend:
    build: ./frontend/angular-app
    ports:
      - "4200:80"
    networks:
      - iot_network

networks:
  iot_network:
    external: true