version: "3.9"

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - iot_network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - iot_network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      retries: 10
      start_period: 30s

  simulator:
    build: ./simulator
    depends_on:
      - kafka
    environment:
      KAFKA_BROKER: kafka:9092
    networks:
      - iot_network

  backend:
    build: ./backend
    depends_on:
      - kafka
    ports:
      - "8000:8000"
    environment:
      KAFKA_BROKER: kafka:9092
    networks:
      - iot_network

  frontend:
    build: ./frontend/angular-app
    ports:
      - "4200:80"
    networks:
      - iot_network

  # ── Storage Layer ────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-04-06T05-26-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API  (Spark writes here)
      - "9001:9001"   # Web UI  →  http://localhost:9001
    volumes:
      - minio-data:/data
    networks:
      - iot_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 8
      start_period: 10s

  # ── Speed Layer ──────────────────────────────────────────────────────────────
  speed-layer:
    build: ./processing/speed_layer
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # ── Kafka
      KAFKA_BROKER:    kafka:9092
      KAFKA_TOPIC:     truck-gps

      # ── Storage backend: "minio" locally, change to "gcs" to migrate
      STORAGE_BACKEND: minio

      # ── MinIO (active when STORAGE_BACKEND=minio)
      MINIO_ENDPOINT:  http://minio:9000
      MINIO_ACCESS:    minioadmin
      MINIO_SECRET:    minioadmin
      MINIO_BUCKET:    fleet-data

      # ── GCS (uncomment when STORAGE_BACKEND=gcs)
      # GCS_BUCKET:                       your-gcs-bucket
      # GOOGLE_APPLICATION_CREDENTIALS:   /secrets/gcp-key.json
    networks:
      - iot_network
    restart: on-failure
    # Uncomment when migrating to GCS:
    # volumes:
    #   - ./gcp-key.json:/secrets/gcp-key.json:ro

volumes:
  minio-data:

networks:
  iot_network:
    driver: bridge