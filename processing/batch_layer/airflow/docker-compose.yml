# ── Fleet Batch Layer — Airflow 3 + Spark ─────────────────────────────────────
# Based on official Airflow 3 docker-compose template.
#
# Key additions vs template:
#   - spark-batch            : Spark container, shares /opt/spark via named volume
#   - spark-home volume      : mounts Spark into all Airflow containers
#   - SPARK_HOME / JAVA_HOME : lets SparkSubmitOperator find spark-submit
#   - batch env vars         : forwarded to Spark jobs via SparkSubmitOperator
#
# Start:
#   echo -e "AIRFLOW_UID=$(id -u)" >> .env
#   docker compose --env-file ../../.env.dev -f docker-compose.batch.yml up -d
#
# UI: http://localhost:8081  (airflow / airflow)
# ─────────────────────────────────────────────────────────────────────────────

x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR:                  LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER:              airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN:      postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY:                ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES:             'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL:  'http://airflow-apiserver:8080/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET:            ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}
    AIRFLOW__API_AUTH__JWT_ISSUER:            ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK:  'true'
    AIRFLOW_CONFIG:                           '/opt/airflow/config/airflow.cfg'

    _PIP_ADDITIONAL_REQUIREMENTS: ''
    SPARK_HOME:   /opt/spark
    SPARK_MASTER: ${SPARK_MASTER:-local[2]}
    AIRFLOW_CONN_SPARK_DEFAULT: 'spark://local?master=local%5B2%5D&deploy-mode=client'
    STORAGE_BACKEND:      ${STORAGE_BACKEND:-minio}
    MINIO_ENDPOINT:       ${MINIO_ENDPOINT:-http://minio:9000}
    MINIO_ACCESS:         ${MINIO_ROOT_USER:-minioadmin}
    MINIO_SECRET:         ${MINIO_ROOT_PASSWORD:-minioadmin}
    MINIO_BUCKET:         ${MINIO_BUCKET:-fleet-data-dev}
    GCS_BUCKET:           ${GCS_BUCKET:-}
    BIGQUERY_PROJECT:     ${BIGQUERY_PROJECT:-}
    BIGQUERY_DATASET:     ${BIGQUERY_DATASET:-fleet_analytics}
    GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    CASSANDRA_HOST:       ${CASSANDRA_HOST:-cassandra}
    CASSANDRA_PORT:       ${CASSANDRA_PORT:-9042}
    CASSANDRA_KEYSPACE:   ${CASSANDRA_KEYSPACE:-fleet}
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
    - ../spark_jobs:/opt/airflow/batch_layer/spark_jobs
    - ../writers:/opt/airflow/batch_layer/writers
    - ../batch_config:/opt/airflow/batch_layer/batch_config
    - spark-home:/opt/spark:ro
  networks:
    - iot_network
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy


services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER:     airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB:       airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    networks:
      - iot_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always


  spark-batch:
    image: spark:3.4.1-scala2.12-java11-python3-ubuntu
    user: root
    environment:
      STORAGE_BACKEND:    ${STORAGE_BACKEND:-minio}
      MINIO_ENDPOINT:     ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS:       ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET:       ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET:       ${MINIO_BUCKET:-fleet-data-dev}
      CASSANDRA_HOST:     ${CASSANDRA_HOST:-cassandra}
      CASSANDRA_PORT:     ${CASSANDRA_PORT:-9042}
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE:-fleet}
    volumes:
      - ../spark_jobs:/app/spark_jobs
      - ../writers:/app/writers
      - ../batch_config:/app/config
      - spark-home:/opt/spark
    networks:
      - iot_network
    command: >
      bash -c "
        cp -rn /opt/spark/. /opt/spark/ 2>/dev/null || true &&
        tail -f /dev/null
      "

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config}
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/
        /entrypoint airflow version
        /entrypoint airflow config list >/dev/null
        chown -v -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,dags,plugins,config}
        echo "Creating spark_default connection..."
        /entrypoint airflow connections delete spark_default 2>/dev/null || true
        /entrypoint airflow connections add spark_default \
          --conn-type spark \
          --conn-host local \
          --conn-extra '{"master":"local[2]","deploy-mode":"client"}'
        echo "✅ spark_default ready"
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE:        'true'
      _AIRFLOW_WWW_USER_CREATE:   'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
      AIRFLOW_CONN_SPARK_DEFAULT: ''
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-cli:
    <<: *airflow-common
    profiles: [debug]
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    command: ["bash", "-c", "airflow"]
    depends_on:
      <<: *airflow-common-depends-on


volumes:
  postgres-db-volume:
  spark-home:

networks:
  iot_network:
    external: true