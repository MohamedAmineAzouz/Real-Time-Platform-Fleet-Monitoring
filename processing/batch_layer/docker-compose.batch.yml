# ── Batch Layer — Airflow 3 + Spark ───────────────────────────────────────────
# Airflow UI: http://localhost:8090
#
# Start:
#   docker compose --env-file ../../.env.dev -f docker-compose.batch.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

x-airflow-common: &airflow-common
  # Airflow 3 — latest stable
  image: apache/airflow:3.0.1
  environment:
    # ── Airflow 3: api-server replaces webserver for task communication ────────
    AIRFLOW__CORE__EXECUTOR:                    LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN:        postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__FERNET_KEY:                  ""
    AIRFLOW__CORE__LOAD_EXAMPLES:               "false"
    AIRFLOW__WEBSERVER__SECRET_KEY:             "fleet-secret"
    # ── Airflow 3: workers communicate via API server, not DB directly ─────────
    AIRFLOW__CORE__INTERNAL_API_SECRET_KEY:     "fleet-internal-secret"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:- apache-airflow-providers-apache-spark boto3 google-cloud-storage cassandra-driver }
    # Batch env vars forwarded to Spark jobs
    STORAGE_BACKEND:      ${STORAGE_BACKEND:-minio}
    MINIO_ENDPOINT:       ${MINIO_ENDPOINT:-http://minio:9000}
    MINIO_ACCESS:         ${MINIO_ROOT_USER:-minioadmin}
    MINIO_SECRET:         ${MINIO_ROOT_PASSWORD:-minioadmin}
    MINIO_BUCKET:         ${MINIO_BUCKET:-fleet-data-dev}
    GCS_BUCKET:           ${GCS_BUCKET:-}
    BIGQUERY_PROJECT:     ${BIGQUERY_PROJECT:-}
    BIGQUERY_DATASET:     ${BIGQUERY_DATASET:-fleet_analytics}
    GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    CASSANDRA_HOST:       ${CASSANDRA_HOST:-cassandra}
    CASSANDRA_PORT:       ${CASSANDRA_PORT:-9042}
    CASSANDRA_KEYSPACE:   ${CASSANDRA_KEYSPACE:-fleet}
    # Airflow 3: admin user created via env vars (users create command removed)
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    _AIRFLOW_WWW_USER_USERNAME: admin
    _AIRFLOW_WWW_USER_PASSWORD: admin
  volumes:
    - ./dags:/opt/airflow/dags
    - ./spark_jobs:/opt/airflow/batch_layer/spark_jobs
    - ./writers:/opt/airflow/batch_layer/writers
    - ./config:/opt/airflow/batch_layer/config
    - airflow-logs:/opt/airflow/logs
  networks:
    - iot_network
  depends_on:
    airflow-db:
      condition: service_healthy


services:

  # ── Airflow metadata DB ────────────────────────────────────────────────────
  airflow-db:
    image: postgres:15
    environment:
      POSTGRES_USER:     airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB:       airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    networks:
      - iot_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 10s


  # ── Cassandra batch schema init (dev only) ─────────────────────────────────
  # Automatically creates batch result tables in Cassandra when
  # STORAGE_BACKEND=minio. Skipped silently in staging/prod.
  # Depends on the external cassandra service (docker-compose.tools.yml).
  cassandra-batch-schema:
    image: python:3.11-slim
    environment:
      STORAGE_BACKEND:    ${STORAGE_BACKEND:-minio}
      CASSANDRA_HOST:     ${CASSANDRA_HOST:-cassandra}
      CASSANDRA_PORT:     ${CASSANDRA_PORT:-9042}
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE:-fleet}
    volumes:
      - ./batch_schema.py:/app/batch_schema.py:ro
    networks:
      - iot_network
    restart: "no"
    command:
      - bash
      - -c
      - |
        if [ "$$STORAGE_BACKEND" != "minio" ]; then
          echo "⏭  STORAGE_BACKEND=$$STORAGE_BACKEND — skipping Cassandra schema init"
          exit 0
        fi

        echo "📦 Installing cassandra-driver..."
        pip install --upgrade pip && \
        pip install --quiet cassandra-driver

        echo "⏳ Waiting for Cassandra..."
        until python3 - <<'PYEOF'
        import os, sys
        from cassandra.cluster import Cluster
        try:
            c = Cluster([os.getenv("CASSANDRA_HOST","cassandra")], port=int(os.getenv("CASSANDRA_PORT","9042")))
            s = c.connect()
            c.shutdown()
        except Exception as e:
            print(f"  not ready: {e}")
            sys.exit(1)
        PYEOF
        do sleep 5; done

        echo "🏗  Creating batch schema..."
        python3 /app/batch_schema.py


  # ── Init: migrate DB + create admin user + install providers ──────────────
  airflow-init:
    <<: *airflow-common
    depends_on:
      airflow-db:
        condition: service_healthy
      cassandra-batch-schema:
        condition: service_completed_successfully
    command: ["bash", "-c", "pip install --quiet --no-cache-dir apache-airflow-providers-apache-spark apache-airflow-providers-standard boto3 google-cloud-storage cassandra-driver && airflow db migrate && (airflow connections add spark_default --conn-type spark --conn-host spark-batch --conn-extra '{\"master\":\"local[2]\",\"deploy-mode\":\"client\",\"spark-home\":\"/opt/spark\"}' || true)"]
    restart: "no"

  # ── API server (Airflow 3: replaces webserver for task execution API) ─────
  # In Airflow 3 the api-server serves both the UI and the internal Task API
  airflow-api-server:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: api-server
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v2/version"]
      interval: 15s
      retries: 10
      start_period: 30s

  # ── Scheduler ─────────────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler

  # ── DAG processor (Airflow 3: separated from scheduler) ───────────────────
  airflow-dag-processor:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: dag-processor

  # ── Spark (batch mode) ─────────────────────────────────────────────────────
  # Airflow submits jobs to this container via SparkSubmitOperator
  spark-batch:
    image: spark:3.4.1-scala2.12-java11-python3-ubuntu
    user: root
    environment:
      STORAGE_BACKEND:    ${STORAGE_BACKEND:-minio}
      MINIO_ENDPOINT:     ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS:       ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET:       ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET:       ${MINIO_BUCKET:-fleet-data-dev}
      CASSANDRA_HOST:     ${CASSANDRA_HOST:-cassandra}
      CASSANDRA_PORT:     ${CASSANDRA_PORT:-9042}
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE:-fleet}
    volumes:
      - ./spark_jobs:/app/spark_jobs
      - ./writers:/app/writers
      - ./config:/app/config
    networks:
      - iot_network
    command: tail -f /dev/null   # stays alive — Airflow submits jobs via spark-submit


volumes:
  airflow-logs:
  airflow-db-data:

networks:
  iot_network:
    external: true