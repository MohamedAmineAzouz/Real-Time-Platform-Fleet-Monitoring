# docker-compose.yml
# docker compose --env-file ../../.env.dev up -d

services:
  spark-master:
    image: apache/spark:3.5.1
    container_name: spark-master
    user: root

    ports:
      - "8080:8080"   # Spark Master UI
      - "7077:7077"   # Spark Master Port
      - "4040:4040"   # Spark App UI

    environment:
      - SPARK_MODE=master
      - CASSANDRA_HOST=${CASSANDRA_HOST:-cassandra}
      - CASSANDRA_PORT=${CASSANDRA_PORT:-9042}
      - CASSANDRA_KEYSPACE=${CASSANDRA_KEYSPACE:-fleet_1}
      - KAFKA_BROKER=${KAFKA_BROKER:-kafka:9092}
      - KAFKA_TOPIC=${KAFKA_TOPIC:-truck-gps-staging-1}

    command: >
      bash -c "
      mkdir -p /home/spark/.ivy2/cache /home/spark/.ivy2/jars &&

      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master &

      sleep 15 &&

      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,com.datastax.spark:spark-cassandra-connector_2.12:3.4.1
      --conf spark.cassandra.connection.host=${CASSANDRA_HOST:-cassandra}
      --conf spark.cassandra.connection.port=${CASSANDRA_PORT:-9042}
      --conf spark.jars.ivy=/home/spark/.ivy2
      /opt/spark/work-dir/streaming_processor.py

      wait
      "

    volumes:
      - spark-data:/opt/spark/work-dir
      - .:/opt/spark/work-dir
      - ivy-cache:/home/spark/.ivy2

    networks:
      - iot_network


  spark-worker-1:
    image: apache/spark:3.5.1
    container_name: spark-worker-1
    depends_on:
      - spark-master

    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
      - CASSANDRA_HOST=${CASSANDRA_HOST:-cassandra}
      - CASSANDRA_PORT=${CASSANDRA_PORT:-9042}
      - CASSANDRA_KEYSPACE=${CASSANDRA_KEYSPACE:-fleet_1}
      - KAFKA_BROKER=${KAFKA_BROKER:-kafka:9092}
      - KAFKA_TOPIC=${KAFKA_TOPIC:-truck-gps-staging-1}

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077

    volumes:
      - spark-data:/opt/spark/work-dir

    networks:
      - iot_network


  spark-worker-2:
    image: apache/spark:3.5.1
    container_name: spark-worker-2
    depends_on:
      - spark-master

    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
      - CASSANDRA_HOST=${CASSANDRA_HOST:-cassandra}
      - CASSANDRA_PORT=${CASSANDRA_PORT:-9042}
      - CASSANDRA_KEYSPACE=${CASSANDRA_KEYSPACE:-fleet_1}
      - KAFKA_BROKER=${KAFKA_BROKER:-kafka:9092}
      - KAFKA_TOPIC=${KAFKA_TOPIC:-truck-gps-staging-1}

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077

    volumes:
      - spark-data:/opt/spark/work-dir

    networks:
      - iot_network


  spark-worker-3:
    image: apache/spark:3.5.1
    container_name: spark-worker-3
    depends_on:
      - spark-master

    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
      - CASSANDRA_HOST=${CASSANDRA_HOST:-cassandra}
      - CASSANDRA_PORT=${CASSANDRA_PORT:-9042}
      - CASSANDRA_KEYSPACE=${CASSANDRA_KEYSPACE:-fleet_1}
      - KAFKA_BROKER=${KAFKA_BROKER:-kafka:9092}
      - KAFKA_TOPIC=${KAFKA_TOPIC:-truck-gps-staging-1}

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077

    volumes:
      - spark-data:/opt/spark/work-dir

    networks:
      - iot_network


volumes:
  spark-data:
  ivy-cache:


networks:
  iot_network:
    external: true