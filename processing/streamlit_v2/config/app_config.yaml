app:
  title: Fleet Command Center
  subtitle: Speed Layer Streaming Command Center
  theme: dark
  page_icon: ":truck:"

refresh:
  interval_seconds: 5
  cache_ttl_seconds: 5
  buffer_snapshots: 72
  stale_after_seconds: 25

map:
  latitude: 33.88
  longitude: -6.85
  zoom: 4.8
  pitch: 38

thresholds:
  overspeed_kmh: 120
  critical_speed_kmh: 145
  low_fuel_pct: 20
  critical_fuel_pct: 10
  high_temp_c: 100
  critical_temp_c: 112
  suspicious_fuel_drop_pct: 6
  gps_jump_speed_kmh: 155
  no_movement_distance_km: 0.05

charts:
  default_height: 330
  map_height: 520
  explorer_height: 360
