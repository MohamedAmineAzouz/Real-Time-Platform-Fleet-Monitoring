services:

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID:                        1
      KAFKA_PROCESS_ROLES:                  broker,controller
      KAFKA_LISTENERS:                      PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS:           PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS:       1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES:      CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:      "true"
      KAFKA_LOG_DIRS:                       /var/lib/kafka/data
      CLUSTER_ID:                           "MkU3OEVBNTcwNTJENDM2Qg"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - iot_network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 15s
      retries: 10
      start_period: 30s
    restart: on-failure


  control-center:
    image: confluentinc/cp-enterprise-control-center:7.5.0
    hostname: control-center
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9021:9021"
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS:       kafka:9092
      CONTROL_CENTER_REPLICATION_FACTOR:      1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_REPLICATION: 1
      CONTROL_CENTER_INTERNAL_TOPICS_REPLICATION: 1
      CONTROL_CENTER_COMMAND_TOPIC_REPLICATION: 1
      CONTROL_CENTER_METRICS_TOPIC_REPLICATION: 1
      CONFLUENT_METRICS_TOPIC_REPLICATION:    1
    networks:
      - iot_network
    restart: on-failure

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - iot_network
    restart: "no"
    command: ["bash", "-c", "kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic ${KAFKA_TOPIC:-truck-gps} --partitions 3 --replication-factor 1 && echo 'Topic ready.'"]

  minio:
    image: minio/minio:RELEASE.2024-04-06T05-26-02Z
    command: server /data --console-address ":${MINIO_CONSOLE_PORT:-9001}"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - iot_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 8
      start_period: 10s
    restart: on-failure

  cassandra:
    image: cassandra:4.1
    environment:
      CASSANDRA_CLUSTER_NAME: fleet-cluster
      CASSANDRA_DC:           dc1
      HEAP_NEWSIZE:           256M
      MAX_HEAP_SIZE:          1024M
    ports:
      - "${CASSANDRA_PORT:-9042}:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    networks:
      - iot_network
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 20s
      retries: 15
      start_period: 60s


  dbgate:
    image: dbgate/dbgate:latest
    container_name: dbgate
    restart: always
    ports:
      - "3001:3000"
    volumes:
      - dbgate_data:/root/.dbgate
    networks:
      - iot_network
    depends_on:
      cassandra:
        condition: service_healthy


  flyway:
    build:
      context: ../db
      dockerfile: Dockerfile
    depends_on:
      cassandra:
        condition: service_healthy
    command:
      - migrate
      - -url=jdbc:cassandra://${CASSANDRA_HOST:-cassandra}:${CASSANDRA_PORT:-9042}?localdatacenter=datacenter1&requesttimeout=30000
      - -schemas=${CASSANDRA_KEYSPACE:-fleet_dev}
      - -defaultSchema=${CASSANDRA_KEYSPACE:-fleet_dev}
      - -locations=filesystem:/flyway/sql
      - -sqlMigrationSuffixes=.cql
      - -baselineOnMigrate=true
      - -connectRetries=10
    volumes:
      - ../db/migration:/flyway/sql
    networks:
      - iot_network
    restart: "no"

  data-seed:
    build: ../application/simulators
    depends_on:
      flyway:
        condition: service_completed_successfully
      cassandra:
        condition: service_healthy
    environment:
      CASSANDRA_HOST:     ${CASSANDRA_HOST:-cassandra}
      CASSANDRA_PORT:     ${CASSANDRA_PORT:-9042}
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE:-fleet}
      CASSANDRA_USER:     ${CASSANDRA_USER:-cassandra}
      CASSANDRA_PASSWORD: ${CASSANDRA_PASSWORD:-cassandra}
      NUM_TRUCKS:         ${NUM_TRUCKS:-10}
    command: ["python", "-c", "from truck_simulator.services.validator import validate_and_seed; validate_and_seed()"]
    networks:
      - iot_network
    restart: "no"

  streamlit:
    build: ../processing/streamlit_v2
    ports:
      - "8501:8501"
    environment:
      CASSANDRA_HOST:     ${CASSANDRA_HOST:-cassandra}
      CASSANDRA_PORT:     ${CASSANDRA_PORT:-9042}
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE:-fleet}
      OLLAMA_HOST:        ${OLLAMA_HOST:-http://ollama:11434}
      OLLAMA_MODEL:       ${OLLAMA_MODEL:-llama3.2}
    networks:
      - iot_network
    depends_on:
      cassandra:
        condition: service_healthy
      data-seed:
        condition: service_completed_successfully

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - iot_network
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:alpine
    container_name: portainer
    command: -H unix:///var/run/docker.sock
    ports:
      - "9003:9000"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "portainer_data:/data"
    restart: always

volumes:
  minio-data:
  cassandra-data:
  kafka-data:
  portainer_data:
  dbgate_data:
  ollama_data:

networks:
  iot_network:
    external: true