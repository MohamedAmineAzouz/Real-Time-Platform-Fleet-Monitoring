version: "3.9"

# ── Streaming Layer ───────────────────────────────────────────────────────────
# Kafka + Zookeeper
# Start first: docker compose -f docker-compose.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - iot_network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:${KAFKA_PORT:-9092}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - iot_network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      retries: 10
      start_period: 30s


  # ── Storage Layer ─────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-04-06T05-26-02Z
    command: server /data --console-address ":${MINIO_CONSOLE_PORT:-9001}"
    environment:
      MINIO_ROOT_USER:     minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API  (Spark writes here)
      - "9001:9001"   # Web UI  →  http://localhost:9001
    volumes:
      - minio-data:/data
    networks:
      - iot_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MINIO_API_PORT:-9000}/minio/health/live"]
      interval: 10s
      retries: 8
      start_period: 10s

  # ── Speed Layer ────────────────────────────────────────────────────────────
  speed-layer:
    build: ../processing/speed_layer
    depends_on:
      minio:
        condition: service_healthy
    environment:
      # ── Kafka
      KAFKA_BROKER: ${KAFKA_BROKER:-kafka:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-truck-gps}

      # ── Storage backend: "minio" locally, change to "gcs" to migrate
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}

      # ── MinIO (active when STORAGE_BACKEND=minio)
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-fleet-data}

      # ── GCS (uncomment when STORAGE_BACKEND=gcs)
      GCS_BUCKET: ${GCS_BUCKET:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    networks:
      - iot_network
    restart: on-failure
    # Uncomment when migrating to GCS:
    # volumes:
    #   - ./gcp-key.json:/secrets/gcp-key.json:ro

volumes:
  minio-data:

networks:
  iot_network:
    external: true