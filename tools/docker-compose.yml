# ── Streaming Layer + Storage Layer + Speed Layer ─────────────────────────────
# Start: docker compose --env-file .env.dev -f docker-compose.yml up -d
# MinIO UI:     http://localhost:9001  (minioadmin / minioadmin)
# Cassandra:    localhost:9042
# ─────────────────────────────────────────────────────────────────────────────

services:

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID:                        1
      KAFKA_PROCESS_ROLES:                  broker,controller
      KAFKA_LISTENERS:                      PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS:           PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS:       1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES:      CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:      "true"
      KAFKA_LOG_DIRS:                       /var/lib/kafka/data
      CLUSTER_ID:                           "MkU3OEVBNTcwNTJENDM2Qg"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - iot_network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 15s
      retries: 10
      start_period: 30s

  # All kafka-topics flags on ONE line — YAML > folds newlines into spaces
  # which breaks CLI argument parsing (the bug you just hit)
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - iot_network
    restart: "no"
    command: ["bash", "-c", "kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic ${KAFKA_TOPIC:-truck-gps} --partitions 3 --replication-factor 1 && echo 'Topic ready.'"]

  # ── Storage Layer: MinIO ──────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-04-06T05-26-02Z
    command: server /data --console-address ":${MINIO_CONSOLE_PORT:-9001}"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - iot_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 8
      start_period: 10s

  # ── Storage Layer: Cassandra ──────────────────────────────────────────────
  cassandra:
    image: cassandra:4.1
    environment:
      CASSANDRA_CLUSTER_NAME: fleet-cluster
      CASSANDRA_DC:           dc1
      HEAP_NEWSIZE:           256M
      MAX_HEAP_SIZE:          1024M
    ports:
      - "${CASSANDRA_PORT:-9042}:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    networks:
      - iot_network
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 20s
      retries: 15
      start_period: 60s
  # ── Cassandra UI (cassandra-web) ──────────────────────────────────────────
  cassandra-ui:
    image: ipushc/cassandra-web:latest
    depends_on:
      cassandra:
        condition: service_healthy
    ports:
      - "3001:8083"
    environment:
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: "9042"
    networks:
      - iot_network
    restart: on-failure

  # ── Database Migration: Flyway ────────────────────────────────────────────
  flyway:
    build:
      context: ../db
      dockerfile: Dockerfile
    depends_on:
      cassandra:
        condition: service_healthy
    command:
      - migrate
      - -url=jdbc:cassandra://${CASSANDRA_HOST:-cassandra}:${CASSANDRA_PORT:-9042}?localdatacenter=datacenter1&requesttimeout=30000
      - -schemas=${CASSANDRA_KEYSPACE:-fleet_dev}
      - -defaultSchema=${CASSANDRA_KEYSPACE:-fleet_dev}
      - -locations=filesystem:/flyway/sql
      - -sqlMigrationSuffixes=.cql
      - -baselineOnMigrate=true
      - -connectRetries=10
    volumes:
      - ../db/migration:/flyway/sql
    networks:
      - iot_network
    restart: "no"

  # ── Data Seeder: validates & seeds Cassandra after Flyway ─────────────────
  data-seed:
    build: ../application/simulators
    depends_on:
      flyway:
        condition: service_completed_successfully
      cassandra:
        condition: service_healthy
    environment:
      CASSANDRA_HOST:     ${CASSANDRA_HOST:-cassandra}
      CASSANDRA_PORT:     ${CASSANDRA_PORT:-9042}
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE:-fleet}
      CASSANDRA_USER:     ${CASSANDRA_USER:-cassandra}
      CASSANDRA_PASSWORD: ${CASSANDRA_PASSWORD:-cassandra}
      NUM_TRUCKS:         ${NUM_TRUCKS:-10}
    command: ["python", "-c", "from truck_simulator.services.validator import validate_and_seed; validate_and_seed()"]
    networks:
      - iot_network
    restart: "no"

  # ── Speed Layer: Spark Structured Streaming ───────────────────────────────
  speed-layer:
    build: ../processing/speed_layer
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      data-seed:
        condition: service_completed_successfully
      flyway:                                   # ← add
        condition: service_completed_successfully
    environment:
      KAFKA_BROKER:    ${KAFKA_BROKER:-kafka:9092}
      KAFKA_TOPIC:     ${KAFKA_TOPIC:-truck-gps}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
      MINIO_ENDPOINT:  ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS:    ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET:    ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET:    ${MINIO_BUCKET:-fleet-data}
      GCS_BUCKET:      ${GCS_BUCKET:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      CASSANDRA_HOST:     ${CASSANDRA_HOST:-cassandra}
      CASSANDRA_PORT:     ${CASSANDRA_PORT:-9042}
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE:-fleet}
    networks:
      - iot_network
    restart: on-failure

  streamlit:
    build: ../processing/streamlit
    ports:
      - "8501:8501"
    environment:
      CASSANDRA_HOST:     ${CASSANDRA_HOST:-cassandra}
      CASSANDRA_PORT:     ${CASSANDRA_PORT:-9042}
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE:-fleet}
    networks:
      - iot_network
    depends_on:
      cassandra:
        condition: service_healthy
      data-seed:
        condition: service_completed_successfully

volumes:
  minio-data:
  cassandra-data:
  kafka-data:

networks:
  iot_network:
    external: true